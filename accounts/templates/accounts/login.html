<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Santé Infantile Bénin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #004d40 0%, #00796b 50%, #26a69a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #004d40, #00796b);
            color: white;
            text-align: center;
            padding: 30px;
            border: none;
        }
        .card-body { padding: 40px; }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e0f2f1;
            padding: 12px 15px;
            font-size: 1rem;
            transition: 0.3s;
        }
        .form-control:focus {
            border-color: #00796b;
            box-shadow: 0 0 0 0.2rem rgba(0,121,107,0.25);
        }
        .input-group .btn {
            border-radius: 0 10px 10px 0;
            border: 2px solid #e0f2f1;
            border-left: none;
            background: white;
            color: #00796b;
        }
        .input-group .form-control {
            border-radius: 10px 0 0 10px;
        }
        .btn-connexion {
            background: linear-gradient(135deg, #004d40, #00796b);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            width: 100%;
            transition: 0.3s;
        }
        .btn-connexion:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,121,107,0.4);
            color: white;
        }
        .link-inscription { color: #00796b; font-weight: 600; }
        .link-inscription:hover { color: #004d40; }
        .alert-danger { border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card">
                    <div class="card-header">
                        <h2 class="mb-1">🏥 Santé Infantile Bénin</h2>
                        <p class="mb-0 opacity-75">Connectez-vous à votre compte</p>
                    </div>
                    <div class="card-body">

                        {% if form.errors %}
                            <div class="alert alert-danger">
                                Numéro ou mot de passe incorrect !
                            </div>
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}

                            <!-- Téléphone -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">📱 Numéro de téléphone</label>
                                <input type="text" name="username" class="form-control" placeholder="Votre numéro de téléphone" required>
                            </div>

                            <!-- Mot de passe -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">🔒 Mot de passe</label>
                                <div class="input-group">
                                    <input type="password" name="password" class="form-control" placeholder="Votre mot de passe" id="password" required>
                                    <button type="button" class="btn" onclick="togglePassword('password', this)">👁️</button>
                                </div>
                            </div>

                            <button type="submit" class="btn-connexion">
                                🔓 Se connecter
                            </button>
                        </form>

                        <p class="text-center mt-3 mb-0">
                            Pas encore inscrit ? <a href="{% url 'register' %}" class="link-inscription">S'inscrire gratuitement</a>
                        </p>

                        <p class="text-center mt-2 mb-0">
                            <a href="{% url 'accueil' %}" class="text-muted small">← Retour à l'accueil</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword(fieldId, btn) {
            var field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
                btn.textContent = '🙈';
            } else {
                field.type = 'password';
                btn.textContent = '👁️';
            }
        }
    </script>
</body>
</html>
