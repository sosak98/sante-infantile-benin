<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un enfant - Santé Infantile Bénin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .navbar-custom { background: linear-gradient(135deg, #004d40, #00796b); padding: 15px 0; }
        .navbar-brand-custom { font-size: 1.3rem; font-weight: 800; color: white !important; }
        .btn-retour { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 6px 16px; font-size: 0.85rem; text-decoration: none; }
        .page-header { background: linear-gradient(135deg, #004d40, #00796b); color: white; padding: 25px 0; margin-bottom: 30px; }
        .page-header h2 { font-weight: 800; }
        .card { border: none; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        .card-header-custom { background: linear-gradient(135deg, #004d40, #00796b); color: white; padding: 20px 25px; border-radius: 20px 20px 0 0; }
        .form-control, .form-select { border-radius: 10px; border: 2px solid #e0f2f1; padding: 10px 15px; transition: 0.3s; }
        .form-control:focus, .form-select:focus { border-color: #00796b; box-shadow: 0 0 0 0.2rem rgba(0,121,107,0.25); }
        .btn-ajouter { background: linear-gradient(135deg, #004d40, #00796b); color: white; border: none; border-radius: 10px; padding: 12px; font-size: 1rem; font-weight: 700; width: 100%; transition: 0.3s; }
        .btn-ajouter:hover { transform: translateY(-2px); color: white; }
        footer { background: #004d40; color: rgba(255,255,255,0.7); text-align: center; padding: 20px; margin-top: 40px; }
        footer strong { color: white; }
        footer a { color: #80cbc4; }
    </style>
</head>
<body>

    <nav class="navbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="navbar-brand-custom">🏥 Santé Infantile Bénin</span>
            <a href="{% url 'profil' %}" class="btn-retour">← Profil</a>
        </div>
    </nav>

    <div class="page-header">
        <div class="container">
            <h2>👶 Ajouter un enfant</h2>
            <p>Enregistrez les informations de votre enfant</p>
        </div>
    </div>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header-custom">
                        <h5 class="mb-0">👶 Informations de l'enfant</h5>
                    </div>
                    <div class="card-body p-4">
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-bold">👤 Prénom</label>
                                <input type="text" name="prenom" class="form-control" placeholder="Prénom de l'enfant" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">👤 Nom</label>
                                <input type="text" name="nom" class="form-control" placeholder="Nom de l'enfant" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">📅 Date de naissance</label>
                                <input type="date" name="date_naissance" class="form-control" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">⚧ Sexe</label>
                                <select name="sexe" class="form-select" required>
                                    <option value="M">👦 Masculin</option>
                                    <option value="F">👧 Féminin</option>
                                </select>
                            </div>
                            <button type="submit" class="btn-ajouter">
                                ✅ Ajouter l'enfant
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 Santé Infantile Bénin — Développé par <strong>SOSSA GNINAZÉ MINGNISSÊ DARIUS</strong></p>
        <p>📧 <a href="mailto:sante.infantile.benin@gmail.com">sante.infantile.benin@gmail.com</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
