{% extends 'base.html' %}

{% block title %}Entrer le code — Santé Infantile Bénin{% endblock %}

{% block content %}
<div class="container" style="max-width:520px;padding-top:40px;padding-bottom:60px;">
  <div class="panel">
    <h3>Code reçu</h3>
    <div class="sub">Saisissez le code envoyé par SMS au <strong>{{ phone }}</strong>.</div>
    <form method="post">
      {% csrf_token %}
      {{ form.phone }}
      <div class="field"><label>🔢 Code reçu</label>{{ form.code }}</div>
      <button class="btn btn-primary btn-block">Vérifier</button>
    </form>
    <p style="margin-top:14px;text-align:center;"><a href="{% url 'accounts:phone_send' %}" style="color:var(--teal-600);font-weight:700;">Renvoyer un code</a></p>
  </div>
</div>
{% endblock %}
