<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vérifier le numéro — Santé Infantile Bénin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h1>Vérification du numéro</h1>
  <p>Entrez le numéro à vérifier. Un code vous sera envoyé par SMS.</p>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-success">Envoyer le code</button>
  </form>
</div>
</body>
</html>
