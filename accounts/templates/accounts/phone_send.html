{% extends 'base.html' %}

{% block title %}Vérifier le numéro - Santé Infantile Bénin{% endblock %}

{% block content %}
<nav class="sib-breadcrumb" aria-label="Fil d'Ariane">
  <div class="container">
    <a href="/">Accueil</a>
    <span class="sep">›</span>
    <a href="/dashboard/">Mon espace</a>
    <span class="sep">›</span>
    <span class="current">Vérification du téléphone</span>
  </div>
</nav>
<div class="container" style="max-width:520px;padding-top:40px;padding-bottom:60px;">
  <div class="panel">
    <h3>Vérification du numéro</h3>
    <div class="sub">Un code vous sera envoyé par SMS.</div>
    <form method="post">
      {% csrf_token %}
      <div class="field"><label>📱 Numéro de téléphone</label>{{ form.phone }}</div>
      <button class="btn btn-primary btn-block">Envoyer le code</button>
    </form>
  </div>
</div>
{% endblock %}
