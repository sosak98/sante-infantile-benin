<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erreur du serveur (500) - Santé Infantile Bénin</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;
         background:#f4f8f7;color:#20302e;display:grid;place-items:center;min-height:100vh;padding:20px;}
    .boite{background:#fff;border-radius:18px;padding:32px;max-width:520px;text-align:center;
           box-shadow:0 6px 24px rgba(0,0,0,.08);}
    h1{color:#00695c;font-size:1.4rem;margin:10px 0;}
    p{color:#5a6a68;line-height:1.55;}
    a.btn{display:inline-block;margin-top:14px;background:#00695c;color:#fff;text-decoration:none;
          padding:10px 20px;border-radius:12px;font-weight:700;}
    .urgence{margin-top:18px;font-size:.9rem;color:#c62828;}
  </style>
</head>
<body>
  <div class="boite">
    <div style="font-size:3rem;"></div>
    <h1>Le serveur a rencontré un problème</h1>
    <p>
      Erreur 500 - l'incident a été enregistré et sera corrigé. Merci de réessayer
      dans quelques instants.
    </p>
    <a class="btn" href="/">Retour à l'accueil</a>
    <p class="urgence">
      <strong>Urgence pour votre enfant ?</strong> N'attendez pas ce site :
      appelez le <a href="tel:112">112</a> ou rendez-vous au centre de santé le plus proche.
    </p>
  </div>
</body>
</html>
